name: Feature request
description: Suggest a new check, tool, lab challenge, or improvement.
title: "[feature] <short summary>"
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Lanternfish to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful
      description: Who does it help, and how? (Keeping beginners in mind is welcome.)
    validations:
      required: false
