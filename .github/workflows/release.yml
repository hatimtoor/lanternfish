name: release

# Builds download-and-run binaries for every platform and attaches them to a
# GitHub Release when you push a version tag (e.g. git tag v0.4.0 && git push --tags).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write      # for build-provenance attestations
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          STAMP="${VERSION#v}" # drop the leading v for the in-binary version
          # CLI for every platform.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            out="dist/lanternfish_${VERSION}_${os}_${arch}${ext}"
            echo "building $out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${STAMP}" -o "$out" ./cmd/lanternfish
          done
          # Native desktop app is Windows-only.
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${STAMP}" -o "dist/lanternfish-gui_${VERSION}_windows_${arch}.exe" ./cmd/lanternfish-gui
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/lanternfish*'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Download the binary for your platform, make it executable, and run it.

            Verify your download:
            - Checksum: `sha256sum -c SHA256SUMS.txt` (or compare against the published hash).
            - Provenance: `gh attestation verify <file> --repo hatimtoor/lanternfish`
              proves GitHub's CI built it from this source — a free, tamper-evident
              alternative to code signing.

            Authorized testing only: use Lanternfish against systems you own or are
            explicitly permitted to test. New to this? Run `lanternfish lab` for a legal
            practice range and `lanternfish guide <url>` for a narrated first assessment.
