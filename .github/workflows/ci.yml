name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Vet
        run: go vet ./...
      - name: Build (all platforms)
        run: |
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              GOOS=$os GOARCH=$arch go build ./cmd/lanternfish
            done
          done
      - name: Test
        run: go test ./...
